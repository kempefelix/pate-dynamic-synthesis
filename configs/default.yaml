# Default Experiment Configuration
# PATE Dynamic Synthesis – Felix Kempe, TU Wien

seed: 42
device: "auto"
num_seeds: 5

dataset:
  name: "MNIST"
  num_classes: 10
  data_dir: "./data"

federation:
  num_teachers: 25
  dirichlet_beta: [0.1, 0.5, 1.0]

teacher:
  architecture: "TeacherCNN"
  epochs: 10
  batch_size: 64
  learning_rate: 0.01
  momentum: 0.9

student:
  architecture: "TeacherCNN"
  epochs: 5
  batch_size: 64
  learning_rate: 0.001

pate:
  noise_scale: 150.0
  use_gaussian: true
  sigma: 150.0
  delta: 1e-5
  epsilon_max: 10.0

cgan:
  latent_dim: 100
  num_epochs: 200
  batch_size: 64
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  image_channels: 1
  feature_maps_g: 64
  feature_maps_d: 64

synthesis:
  strategy: "variant_a"
  num_rounds: 20
  samples_per_round: 1000
  variant_a:
    alpha: 2.0
  variant_b:
    beta: 2.0
    lambda_contrast: 0.3
    top_m_confusions: 3
    n_base_ratio: 0.7
    n_contrast_ratio: 0.3

evaluation:
  target_accuracy: 0.95
  convergence_threshold: 0.005
  metrics: ["accuracy", "macro_f1", "epsilon", "teacher_queries", "kl_divergence"]

baselines:
  run_upper_bound: true
  run_classical_pate: true
  run_static_synthesis: true

logging:
  save_dir: "./results"
  save_checkpoints: true
  log_interval: 1
